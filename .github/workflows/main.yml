name: Actualizacion Diaria Clima Balcarce

on:
  schedule:
    # Horarios en UTC (Argentina es UTC-3):
    # 11:00 UTC = 08:00 AM
    # 17:00 UTC = 02:00 PM
    # 23:00 UTC = 08:00 PM
    - cron: '0 11,17,23 * * *'
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install requests pandas

      - name: Ejecutar script de clima
        run: python actualizar_clima.py

      - name: Subir cambios al repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add meteo_daily.csv
          
          if git diff --staged --quiet; then
            echo "No hay cambios en el pronóstico de Balcarce. Saltando commit."
          else
            git commit -m "Actualización programada: Clima Balcarce (ECMWF)"
            git push
          fi
