name: Preparar privado temporal

on:
  push:
    branches:
      - agent/prepare-private-balcarce
    paths:
      - ".github/workflows/preparar_privado_temporal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar rama
        uses: actions/checkout@v4
        with:
          ref: agent/prepare-private-balcarce
          fetch-depth: 0

      - name: Adaptar punto de entrada
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app_emergenciacombinado.py")
          source = path.read_text(encoding="utf-8")
          old = '''from pathlib import Path

          _CORE_APP = Path(__file__).with_name("app_emergenciacombinado_core.py")
          exec(
              compile(_CORE_APP.read_text(encoding="utf-8"), str(_CORE_APP), "exec"),
              globals(),
          )'''
          new = '''from pathlib import Path

          from private_runtime import build_private_core_source


          _CORE_APP = Path(__file__).with_name("app_emergenciacombinado_core.py")
          _PRIVATE_CORE_SOURCE = build_private_core_source(_CORE_APP)
          exec(
              compile(_PRIVATE_CORE_SOURCE, str(_CORE_APP), "exec"),
              globals(),
          )'''
          if old not in source:
              raise SystemExit("No se encontró el bloque esperado del punto de entrada.")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verificar adaptación
        run: |
          python private_runtime.py
          python -m py_compile app_emergenciacombinado.py app_emergenciacombinado_core.py private_runtime.py

      - name: Guardar parche
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_emergenciacombinado.py
          if git diff --cached --quiet; then
            echo "El punto de entrada ya estaba adaptado."
            exit 0
          fi
          git commit -m "Adaptar punto de entrada para repositorio privado"
          git push origin HEAD:agent/prepare-private-balcarce
